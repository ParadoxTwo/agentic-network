[project]
name = "agentic-network"
version = "0.0.0"
description = "A shallow orchestrator-worker network of specialized AI agents under a single human owner."
readme = "README.md"
# Plan targets 3.12; the dev sandbox ships 3.11, so we floor at 3.11.
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "pydantic>=2.7",
    "anthropic>=0.40",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Integration tests need the live store; they self-skip if it's unreachable.
markers = ["integration: requires a running Postgres + Redis"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["store", "schemas"]
